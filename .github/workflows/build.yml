
name: Build Modified GlassOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract modified GlassOS source
        run: |
          unzip -q GlassOS-manual-permissions-source-fixed.zip -d /tmp/glassos-source
          rsync -a /tmp/glassos-source/glassos-tv-main/ ./
          rm GlassOS-manual-permissions-source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassOS-manual-permissions
          path: app/build/outputs/apk/debug/app-debug.apk
